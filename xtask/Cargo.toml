[package]
name = "xtask"
version = "0.0.0"
edition = "2024"
publish = false

# The project's own tasks, run by `cargo xtask <task>`, the alias in
# `.cargo/config.toml`. Modelled on vc-x1's xtask: the version and its
# bump are the project's, and `vc-x1` never writes them. The tasks are
# `xtask-lib`'s, and this binary is their arguments and dispatch.

[dependencies]
# The argument parser and its completion engine, so
# `cargo xtask <tab>` asks this binary for its tasks.
clap = { version = "4.6", features = ["derive", "wrap_help"] }
clap_complete = { version = "4.6", features = ["unstable-dynamic"] }
# The tasks themselves.
xtask-lib = { path = "../xtask-lib" }
