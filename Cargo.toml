[package]
name = "io-uring-x1"
version = "0.2.0-3"
edition = "2024"

# The workspace: `io-uring-x1` itself and `xtask`, the project's own
# tasks (`cargo xtask bump next`), both built, tested, and linted by
# default.
[workspace]
members = [".", "xtask"]
default-members = [".", "xtask"]

[dependencies]
rustix = { version = "1.1.6", features = ["io_uring", "mm"] }
